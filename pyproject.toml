[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "scrape-engine"
version = "0.1.0"
description = "Product scrape engine for Tokopedia, Shopee, Blibli, Amazon, and Alibaba"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "playwright>=1.40.0",
  "openpyxl>=3.1.2",
  "fastapi>=0.110.0",
  "uvicorn[standard]>=0.27.0",
  "typer>=0.12.0",
  "pydantic>=2.6.0",
  "httpx>=0.27.0",
  "beautifulsoup4>=4.12.0",
  "lxml>=5.0.0",
  "pyodbc>=5.1.0",
  "python-dotenv>=1.0.0",
  "camoufox>=0.4.11",
]

[project.scripts]
scrape-engine = "scrape_engine.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
